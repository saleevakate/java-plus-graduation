spring:
  application:
    name: test-cleanup
  cloud:
    config:
      enabled: false

  datasource:
    user:
      jdbc-url: jdbc:postgresql://user-db:5432/user-db
      username: localAdmin
      password: localadmin
      driver-class-name: org.postgresql.Driver

    event:
      jdbc-url: jdbc:postgresql://event-db:5432/event-db
      username: localAdmin
      password: localadmin
      driver-class-name: org.postgresql.Driver

    request:
      jdbc-url: jdbc:postgresql://request-db:5432/request-db
      username: localAdmin
      password: localadmin
      driver-class-name: org.postgresql.Driver

    stats:
      jdbc-url: jdbc:postgresql://stats-db:5432/stats-db
      username: localAdmin
      password: localadmin
      driver-class-name: org.postgresql.Driver

server:
  port: 9099

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true