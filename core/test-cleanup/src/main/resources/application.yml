spring:
  application:
    name: test-cleanup
  datasource:
    url: jdbc:postgresql://ewm-db:5432/ewm-db
    username: localAdmin
    password: localadmin
    driver-class-name: org.postgresql.Driver
  cloud:
    config:
      enabled: false

server:
  port: 9099

logging:
  level:
    ru.practicum: INFO

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true