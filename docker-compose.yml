services:
  discovery-server:
    image: eclipse-temurin:21-jdk-alpine
    container_name: discovery-server
    working_dir: /app
    volumes:
      - ./infra/discovery-server/target:/app
    command: java -jar discovery-server-0.0.1-SNAPSHOT.jar
    ports:
      - "8761:8761"
    environment:
      - TZ=UTC
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    image: eclipse-temurin:21-jdk-alpine
    container_name: config-server
    working_dir: /app
    volumes:
      - ./infra/config-server/target:/app
      - ./infra/config-repo:/config-repo
    command: java -jar config-server-0.0.1-SNAPSHOT.jar
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config-repo
      - TZ=UTC
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-server:
    image: eclipse-temurin:21-jdk-alpine
    container_name: gateway-server
    working_dir: /app
    volumes:
      - ./infra/gateway-server/target:/app
    command: java -jar gateway-server-0.0.1-SNAPSHOT.jar
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - TZ=UTC

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=stats-db
      - POSTGRES_USER=localAdmin
      - POSTGRES_PASSWORD=localadmin
      - TZ=UTC
    volumes:
      - ./db/stats-schema.sql:/docker-entrypoint-initdb.d/stats-schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U localAdmin -d stats-db" ]
      interval: 5s
      timeout: 3s
      retries: 5

  user-db:
    image: postgres:16.1
    container_name: user-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=user-db
      - POSTGRES_USER=localAdmin
      - POSTGRES_PASSWORD=localadmin
      - TZ=UTC
    volumes:
      - ./db/user-schema.sql:/docker-entrypoint-initdb.d/user-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localAdmin -d user-db"]
      interval: 5s
      timeout: 3s
      retries: 5

  event-db:
    image: postgres:16.1
    container_name: event-db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=event-db
      - POSTGRES_USER=localAdmin
      - POSTGRES_PASSWORD=localadmin
      - TZ=UTC
    volumes:
      - ./db/event-schema.sql:/docker-entrypoint-initdb.d/event-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localAdmin -d event-db"]
      interval: 5s
      timeout: 3s
      retries: 5

  request-db:
    image: postgres:16.1
    container_name: request-db
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=request-db
      - POSTGRES_USER=localAdmin
      - POSTGRES_PASSWORD=localadmin
      - TZ=UTC
    volumes:
      - ./db/request-schema.sql:/docker-entrypoint-initdb.d/request-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localAdmin -d request-db"]
      interval: 5s
      timeout: 3s
      retries: 5

  stats-server:
    image: eclipse-temurin:21-jdk-alpine
    container_name: stats-server
    working_dir: /app
    volumes:
      - ./stats-service/stats-server/target:/app
    command: java -jar stats-server-0.0.1-SNAPSHOT.jar
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      stats-db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - TZ=UTC

  user-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: user-service
    working_dir: /app
    volumes:
      - ./user-service/target:/app
    command: java -jar user-service-0.0.1-SNAPSHOT.jar
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - TZ=UTC

  event-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: event-service
    working_dir: /app
    volumes:
      - ./event-service/target:/app
    command: java -jar event-service-0.0.1-SNAPSHOT.jar
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      event-db:
        condition: service_healthy
      stats-server:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - TZ=UTC

  request-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: request-service
    working_dir: /app
    volumes:
      - ./request-service/target:/app
    command: java -jar request-service-0.0.1-SNAPSHOT.jar
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      request-db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - TZ=UTC

  location-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: location-service
    working_dir: /app
    volumes:
      - ./location-service/target:/app
    command: java -jar location-service-0.0.1-SNAPSHOT.jar
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - TZ=UTC

  test-cleanup:
    image: eclipse-temurin:21-jdk-alpine
    container_name: test-cleanup
    working_dir: /app
    volumes:
      - ./core/test-cleanup/target:/app
    command: java -jar test-cleanup-0.0.1-SNAPSHOT.jar
    ports:
      - "9099:9099"
    depends_on:
      user-db:
        condition: service_healthy
      event-db:
        condition: service_healthy
      request-db:
        condition: service_healthy
      stats-db:
        condition: service_healthy
    environment:
      - TZ=UTC
    restart: "no"
    networks:
      - explore-with-me-network