services:
  # ============================================
  # 1. DISCOVERY SERVER (Eureka)
  # ============================================
  discovery-server:
    image: eclipse-temurin:21-jdk-alpine
    container_name: discovery-server
    working_dir: /app
    volumes:
      - ./infra/discovery-server/target:/app
    command: java -jar discovery-server-0.0.1-SNAPSHOT.jar
    ports:
      - "8761:8761"
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # 2. CONFIG SERVER
  # ============================================
  config-server:
    image: eclipse-temurin:21-jdk-alpine
    container_name: config-server
    working_dir: /app
    volumes:
      - ./infra/config-server/target:/app
      - ./infra/config-repo:/config-repo
    command: java -jar config-server-0.0.1-SNAPSHOT.jar
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config-repo
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # 3. GATEWAY SERVER
  # ============================================
  gateway-server:
    image: eclipse-temurin:21-jdk-alpine
    container_name: gateway-server
    working_dir: /app
    volumes:
      - ./infra/gateway-server/target:/app
    command: java -jar gateway-server-0.0.1-SNAPSHOT.jar
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - TZ=UTC

  # ============================================
  # 4. STATS DATABASE
  # ============================================
  stats-db:
    image: postgres:16.1
    container_name: stats-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=stats-db
      - POSTGRES_USER=localAdmin
      - POSTGRES_PASSWORD=localadmin
      - TZ=UTC
    volumes:
      - ./stats-service/stats-server/src/main/resources:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localAdmin -d stats-db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # 5. STATS SERVER
  # ============================================
  stats-server:
    image: eclipse-temurin:21-jdk-alpine
    container_name: stats-server
    working_dir: /app
    volumes:
      - ./stats-service/stats-server/target:/app
    command: java -jar stats-server-0.0.1-SNAPSHOT.jar
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      stats-db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - TZ=UTC

  # ============================================
  # 6. EWM DATABASE (основная БД)
  # ============================================
  ewm-db:
    image: postgres:16.1
    container_name: ewm-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=ewm-db
      - POSTGRES_USER=localAdmin
      - POSTGRES_PASSWORD=localadmin
      - TZ=UTC
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localAdmin -d ewm-db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # 7. USER SERVICE
  # ============================================
  user-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: user-service
    working_dir: /app
    volumes:
      - ./user-service/target:/app
    command: java -jar user-service-0.0.1-SNAPSHOT.jar
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - TZ=UTC

  # ============================================
  # 8. REQUEST SERVICE
  # ============================================
  request-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: request-service
    working_dir: /app
    volumes:
      - ./request-service/target:/app
    command: java -jar request-service-0.0.1-SNAPSHOT.jar
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - TZ=UTC

  # ============================================
  # 9. EVENT SERVICE
  # ============================================
  event-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: event-service
    working_dir: /app
    volumes:
      - ./event-service/target:/app
    command: java -jar event-service-0.0.1-SNAPSHOT.jar
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
      stats-server:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - TZ=UTC