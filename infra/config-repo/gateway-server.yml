server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service-admin
          uri: lb://user-service
          predicates:
            - Path=/api/admin/users/**
          filters:
            - StripPrefix=1
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - POST
                  - GET
                  - DELETE
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: event-service-public-events
          uri: lb://event-service
          predicates:
            - Path=/api/events/**
            - Method=GET
          filters:
            - StripPrefix=1
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: event-service-public-categories
          uri: lb://event-service
          predicates:
            - Path=/api/categories/**
            - Method=GET
          filters:
            - StripPrefix=1

        - id: event-service-public-compilations
          uri: lb://event-service
          predicates:
            - Path=/api/compilations/**
            - Method=GET
          filters:
            - StripPrefix=1

        - id: event-service-admin
          uri: lb://event-service
          predicates:
            - Path=/api/admin/events/**
          filters:
            - StripPrefix=1

        - id: event-service-admin-categories
          uri: lb://event-service
          predicates:
            - Path=/api/admin/categories/**
          filters:
            - StripPrefix=1

        - id: event-service-admin-compilations
          uri: lb://event-service
          predicates:
            - Path=/api/admin/compilations/**
          filters:
            - StripPrefix=1

        - id: event-service-private
          uri: lb://event-service
          predicates:
            - Path=/api/users/*/events/**
          filters:
            - StripPrefix=1

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/api/users/*/requests/**
          filters:
            - StripPrefix=1

        - id: request-service-events
          uri: lb://request-service
          predicates:
            - Path=/api/users/*/events/*/requests/**
          filters:
            - StripPrefix=1

        - id: stats-service
          uri: lb://stats-server
          predicates:
            - Path=/api/stats/**
          filters:
            - StripPrefix=1

        - id: location-service
          uri: lb://location-service
          predicates:
            - Path=/api/location/**
          filters:
            - StripPrefix=1

        - id: test-cleanup
          uri: lb://test-cleanup
          predicates:
            - Path=/api/test-cleanup/**
          filters:
            - StripPrefix=1

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
            max-age: 3600

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG