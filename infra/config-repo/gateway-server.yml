server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service-admin
          uri: lb://user-service
          predicates:
            - Path=/api/v1/admin/users/**
          filters:
            - StripPrefix=1
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE

        - id: event-service-public-events
          uri: lb://event-service
          predicates:
            - Path=/api/v1/events/**
            - Method=GET
          filters:
            - StripPrefix=1

        - id: event-service-public-categories
          uri: lb://event-service
          predicates:
            - Path=/api/v1/categories/**
            - Method=GET
          filters:
            - StripPrefix=1

        - id: event-service-public-compilations
          uri: lb://event-service
          predicates:
            - Path=/api/v1/compilations/**
            - Method=GET
          filters:
            - StripPrefix=1

        - id: event-service-admin
          uri: lb://event-service
          predicates:
            - Path=/api/v1/admin/events/**
          filters:
            - StripPrefix=1

        - id: event-service-admin-categories
          uri: lb://event-service
          predicates:
            - Path=/api/v1/admin/categories/**
          filters:
            - StripPrefix=1

        - id: event-service-admin-compilations
          uri: lb://event-service
          predicates:
            - Path=/api/v1/admin/compilations/**
          filters:
            - StripPrefix=1

        - id: event-service-private
          uri: lb://event-service
          predicates:
            - Path=/api/v1/users/**/events/**
          filters:
            - StripPrefix=1

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/api/v1/users/**/requests/**
          filters:
            - StripPrefix=1

        - id: request-service-events
          uri: lb://request-service
          predicates:
            - Path=/api/v1/users/**/events/**/requests/**
          filters:
            - StripPrefix=1

        - id: stats-service
          uri: lb://stats-server
          predicates:
            - Path=/api/v1/stats/**
          filters:
            - StripPrefix=1

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
            max-age: 3600

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG