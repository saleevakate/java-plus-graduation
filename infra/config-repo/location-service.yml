server:
  port: 0

spring:
  application:
    name: location-service
  cloud:
    config:
      enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    ru.practicum: DEBUG
    org.springframework.web: DEBUG